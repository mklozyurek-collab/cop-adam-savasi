<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Çöp Adam Savaşı</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#0d0f1a; overflow:hidden; font-family:'Segoe UI', Arial, sans-serif;
              touch-action:none; -webkit-user-select:none; user-select:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { background:#000; box-shadow:0 0 60px rgba(80,120,255,.15); border-radius:8px; max-width:100vw; max-height:100vh; }
  #touch { position:fixed; inset:0; pointer-events:none; display:none; z-index:10; }
  .tbtn {
    position:absolute; width:76px; height:76px; border-radius:50%;
    background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.35);
    color:#fff; font-size:28px; font-weight:bold; pointer-events:auto;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    user-select:none; -webkit-user-select:none; touch-action:none;
    -webkit-tap-highlight-color:transparent;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
  }
  .tbtn.on { background:rgba(255,255,255,.35); border-color:#fff; transform:scale(.94); }
  .tbtn small { font-size:10px; color:#ffffffbb; font-weight:normal; margin-top:-4px; letter-spacing:1px; }
  /* SOL taraf: hareket — aralarında geniş boşluk */
  #btnL{ left:calc(16px + env(safe-area-inset-left));  bottom:34px }
  #btnR{ left:calc(134px + env(safe-area-inset-left)); bottom:34px }
  /* SAĞ taraf: üstte zıpla, altta yumruk + silah (aralıklı) */
  #btnJ{ right:calc(80px + env(safe-area-inset-right));  bottom:146px }
  #btnP{ right:calc(138px + env(safe-area-inset-right)); bottom:30px }
  #btnS{ right:calc(16px + env(safe-area-inset-right));  bottom:30px;
         width:96px; height:96px; font-size:36px;
         background:rgba(125,211,252,.16); border-color:#7dd3fc99 }
  /* ULTİ: alt-orta, sadece hazır olunca görünür */
  #btnU{ left:50%; transform:translateX(-50%); bottom:30px; width:86px; height:86px;
         background:rgba(255,215,0,.18); border-color:#ffd700; color:#ffd700;
         display:none; animation:pulse 1s infinite; font-size:34px; }
  @keyframes pulse {
    0%,100% { box-shadow:0 0 12px 2px rgba(255,215,0,.5); }
    50%     { box-shadow:0 0 26px 8px rgba(255,215,0,.85); }
  }
  /* DURAKLAT: sağ üst köşe */
  #btnPause{ top:calc(12px + env(safe-area-inset-top)); right:calc(16px + env(safe-area-inset-right));
             width:50px; height:50px; font-size:20px; display:none; }
  /* DASH: sol üstte hareket tuşlarının üstünde */
  #btnDash{ left:calc(75px + env(safe-area-inset-left)); bottom:120px;
            width:62px; height:62px; font-size:22px; display:none;
            background:rgba(125,211,252,.14); border-color:#7dd3fc99 }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="540"></canvas></div>
<div id="touch">
  <div class="tbtn" id="btnL">◀</div>
  <div class="tbtn" id="btnR">▶</div>
  <div class="tbtn" id="btnJ">▲<small>ZIPLA</small></div>
  <div class="tbtn" id="btnP">👊<small>YUMRUK</small></div>
  <div class="tbtn" id="btnS">⚔️<small>SİLAH</small></div>
  <div class="tbtn" id="btnU">⚡<small>ULTİ</small></div>
  <div class="tbtn" id="btnDash">💨<small>DASH</small></div>
  <div class="tbtn" id="btnPause">⏸</div>
</div>
<script>
"use strict";
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 960, H = 540, GROUND = 470;

// ---------- silahlar ----------
const WEAPONS = {
  kisa:   { name:'Kısa Kılıç', icon:'🗡', draw:'sword', len:34,
            dmg:14, range:80,  dur:.28, hitT:.11, cd:.28, kb:210, hgt:90,
            sDmg:.35, sSpd:.95, sRng:.35, iyi:'+ Çok hızlı saldırır', kotu:'− Menzili kısa' },
  uzun:   { name:'Uzun Kılıç', icon:'⚔️', draw:'sword', len:54,
            dmg:22, range:115, dur:.45, hitT:.18, cd:.6,  kb:300, hgt:90,
            sDmg:.6, sSpd:.55, sRng:.7,  iyi:'+ Dengeli ve güvenilir', kotu:'− Öne çıkan yönü yok' },
  balta:  { name:'Balta', icon:'🪓', draw:'axe', len:42,
            dmg:36, range:95,  dur:.62, hitT:.3,  cd:.95, kb:450, hgt:90,
            sDmg:1,  sSpd:.22, sRng:.5,  iyi:'+ Yıkıcı hasar + savurma', kotu:'− Çok yavaş sallanır' },
  gurz:   { name:'Gürz', icon:'🔨', draw:'mace', len:38, aoe:true,
            dmg:28, range:78,  dur:.55, hitT:.26, cd:.85, kb:400, hgt:95,
            sDmg:.8, sSpd:.3,  sRng:.3,  iyi:'+ İki yöne birden vurur', kotu:'− Kısa menzil, yavaş' },
  mizrak: { name:'Mızrak', icon:'🔱', draw:'spear', len:74,
            dmg:11, range:160, dur:.32, hitT:.13, cd:.4,  kb:170, hgt:60,
            sDmg:.28, sSpd:.7, sRng:1,   iyi:'+ Çok uzaktan dürter', kotu:'− Hasarı düşük, dar açı' }
};
const WKEYS = ['kisa','uzun','balta','gurz','mizrak'];
const PUNCH = { dmg:6, range:60, dur:.18, hitT:.07, cd:.1, kb:120, hgt:85 };
const ULTI_NEED = 8;
const BOSS_EVERY = 10; // her 10 dalgada bir boss

// ---------- ses & titreşim ----------
let soundOn = true, vibOn = true, audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!soundOn || !audioCtx) return;
  const pr = 1 + (Math.random()*2 - 1) * 0.06; // tekrar hissini kıran hafif perde varyasyonu
  f0 *= pr; f1 *= pr;
  const t = audioCtx.currentTime + (delay || 0);
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(Math.max(1, f0), t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol || .2, t);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + .05);
}
function noiseBurst(dur, vol, freq, q, delay) {
  if (!soundOn || !audioCtx) return;
  const t = audioCtx.currentTime + (delay || 0);
  const n = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq * (1 + (Math.random()*2-1)*0.08); f.Q.value = q || 1;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  src.connect(f); f.connect(g); g.connect(audioCtx.destination);
  src.start(t);
}
function sfx(name) {
  if (!soundOn || !audioCtx) return;
  switch (name) {
    case 'swing':   noiseBurst(.12,.1,1800,1); tone(520,220,.12,'sine',.05); break;
    case 'punch':   tone(300,90,.08,'square',.12); break;
    case 'hit':     tone(220,70,.12,'square',.18); noiseBurst(.08,.14,900,1); break;
    case 'kill':    tone(600,80,.25,'sawtooth',.16); noiseBurst(.2,.18,600,1); break;
    case 'hurt':    tone(420,120,.3,'sawtooth',.2); break;
    case 'jump':    tone(250,520,.14,'sine',.07); break;
    case 'wave':    tone(440,440,.12,'triangle',.14); tone(660,660,.14,'triangle',.14,.14); break;
    case 'ulti':    tone(60,45,.9,'sawtooth',.3); tone(200,950,.6,'sine',.18,.1); break;
    case 'bolt':    noiseBurst(.18,.3,2600,.7); tone(1200,180,.2,'square',.1); break;
    // silaha özel ulti sesleri
    case 'ulti_kisa':   tone(400,1900,.4,'sine',.18); tone(600,2500,.45,'sine',.12,.08); noiseBurst(.3,.08,4000,.8,.05); break;
    case 'slash':       noiseBurst(.08,.2,3600,2); tone(1500,420,.1,'sawtooth',.08); break;
    case 'ulti_balta':  tone(48,28,1.3,'sawtooth',.35); noiseBurst(1.1,.2,110,.5); tone(70,40,1,'square',.15,.1); break;
    case 'quakehit':    tone(95,38,.32,'square',.3); noiseBurst(.26,.26,220,1); break;
    case 'ulti_gurz':   tone(80,220,.9,'sawtooth',.24); noiseBurst(.8,.12,500,.5,.1); break;
    case 'meteor':      noiseBurst(.35,.14,750,.6); tone(900,250,.35,'sine',.06); break;
    case 'meteorhit':   tone(100,28,.42,'sine',.4); noiseBurst(.3,.3,420,1); break;
    case 'ulti_mizrak': tone(900,2600,.5,'sine',.12); noiseBurst(.55,.1,2200,.5); break;
    case 'spear':       tone(2100,650,.22,'sine',.07); break;
    case 'spearhit':    tone(320,85,.12,'square',.2); noiseBurst(.06,.2,1300,1.5); break;
    case 'slam':    tone(120,35,.4,'sine',.35); noiseBurst(.3,.28,300,1); break;
    case 'roar':    tone(140,55,.8,'sawtooth',.28); tone(90,42,.85,'square',.18,.05); break;
    case 'bossdie': tone(500,50,.9,'sawtooth',.26); noiseBurst(.6,.26,500,1); tone(300,55,.7,'square',.16,.15); break;
    case 'click':   tone(700,480,.06,'square',.1); break;
    case 'start':   tone(523,784,.25,'triangle',.18); break;
    case 'gameover':[392,311,262].forEach((f,i)=>tone(f,f*.97,.34,'triangle',.18,i*.3)); break;
  }
}
function vib(p) {
  if (vibOn && navigator.vibrate) { try { navigator.vibrate(p); } catch(e){} }
}

// ---------- girdi ----------
const keys = {};
let selIdx = 1; // varsayılan: uzun kılıç
addEventListener('keydown', e => {
  keys[e.code] = true;
  ensureAudio();
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if ((e.code === 'KeyP' || e.code === 'Escape') && (state === 'play' || state === 'wave')) { togglePause(); return; }
  if (paused) {
    const bi = ['Digit1','Digit2','Digit3','Digit4'].indexOf(e.code);
    if (bi >= 0 && bi < SHOP.length) buyUpgrade(SHOP[bi]);
    return;
  }
  if (state === 'perkpick') {
    const pi = ['Digit1','Digit2','Digit3'].indexOf(e.code);
    if (pi >= 0 && pi < perkChoices.length) applyPerk(perkChoices[pi]);
    return;
  }
  if (state === 'select') {
    if (e.code === 'ArrowLeft')  { selIdx = (selIdx + WKEYS.length - 1) % WKEYS.length; sfx('click'); }
    if (e.code === 'ArrowRight') { selIdx = (selIdx + 1) % WKEYS.length; sfx('click'); }
    const d = ['Digit1','Digit2','Digit3','Digit4','Digit5'].indexOf(e.code);
    if (d >= 0) { selIdx = d; sfx('click'); }
    if (e.code === 'KeyM') { soundOn = !soundOn; if (soundOn) sfx('click'); saveSave(); }
    if (e.code === 'KeyV') { vibOn = !vibOn; sfx('click'); if (vibOn) vib(60); saveSave(); }
    if (e.code === 'Enter' || e.code === 'Space') startGame();
  } else if (state === 'gameover' && (e.code === 'KeyR' || e.code === 'Enter')) {
    state = 'select';
  } else if (e.code === 'KeyU') {
    tryUlti(); // anında işle — kare atlamasına takılmasın
  }
});
addEventListener('keyup', e => keys[e.code] = false);

function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
const inRect = (p, r) => p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h;
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  const p = canvasPos(e);
  if (paused) {
    for (let i = 0; i < SHOP.length; i++) if (inRect(p, pauseCardRect(i))) { buyUpgrade(SHOP[i]); return; }
    if (inRect(p, pauseResumeRect())) togglePause();
    return;
  }
  if (state === 'perkpick') {
    for (let i = 0; i < perkChoices.length; i++) if (inRect(p, perkCardRect(i))) { applyPerk(perkChoices[i]); return; }
    return;
  }
  if (state === 'select') {
    if (inRect(p, sndBtnRect())) { soundOn = !soundOn; if (soundOn) sfx('click'); saveSave(); return; }
    if (inRect(p, vibBtnRect())) { vibOn = !vibOn; sfx('click'); if (vibOn) vib(60); saveSave(); return; }
    for (let i = 0; i < WKEYS.length; i++) {
      if (inRect(p, cardRect(i))) {
        if (selIdx === i) { startGame(); return; }  // seçiliye tekrar dokun → başla
        selIdx = i; sfx('click'); return;
      }
    }
    if (inRect(p, startBtnRect())) startGame();
  } else if (state === 'gameover') {
    state = 'select';
    sfx('click');
  }
});

// dokunmatik kontroller
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 ||
                (window.matchMedia && matchMedia('(pointer:coarse)').matches);
const btnU = document.getElementById('btnU');
if (isTouch) {
  document.getElementById('touch').style.display = 'block';
  const press = (el, code, down) => {
    keys[code] = down;
    el.classList.toggle('on', down);
    if (down) ensureAudio();
  };
  const bind = (id, code) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown',   e => { e.preventDefault(); press(el, code, true); });
    el.addEventListener('pointerup',     e => { e.preventDefault(); press(el, code, false); });
    el.addEventListener('pointercancel', () => press(el, code, false));
    el.addEventListener('pointerleave',  () => press(el, code, false));
    el.addEventListener('touchstart', e => { e.preventDefault(); press(el, code, true); }, { passive:false });
    el.addEventListener('touchend',   e => { e.preventDefault(); press(el, code, false); }, { passive:false });
  };
  bind('btnL','ArrowLeft'); bind('btnR','ArrowRight'); bind('btnJ','ArrowUp');
  bind('btnP','KeyJ'); bind('btnS','KeyK'); bind('btnU','KeyU'); bind('btnDash','KeyL');
  document.getElementById('btnPause').addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); togglePause(); });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
  document.addEventListener('gesturestart', e => e.preventDefault());
}

// ---------- yardımcılar ----------
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const lerp = (a,b,t) => a + (b-a)*t;

// ---------- oyun durumu ----------
let state = 'select';   // select | wave | play | gameover
let player = null, wave = 0, score = 0, combo = 0, comboTimer = 0, best = 0, kills = 0;
let enemies = [], particles = [], floaters = [], bolts = [], rings = [];
let slashes = [], ghosts = [], quakes = [], meteors = [], spearsFx = [], crack = null;
let ebolts = []; // düşman/boss mermileri
let waveTimer = 0, shake = 0, tGlobal = 0;
let ultiKills = 0, ultiReady = false, ulti = null, flash = 0, timeScale = 1;
let paused = false, coins = 0;
// oyun hissi (juice)
let hitstop = 0, zoom = 1, hpChip = 100, slowmoT = 0, dashPrev = false;
function punch(z, hs) { zoom = Math.max(zoom, z); hitstop = Math.max(hitstop, hs); }

// ---------- kalıcı kayıt (localStorage) ----------
const SAVE_KEY = 'copadam_save_v1';
let bestWave = 0, totalKills = 0, newRecord = false;
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    if (typeof s.best === 'number') best = s.best;
    if (typeof s.bestWave === 'number') bestWave = s.bestWave;
    if (typeof s.totalKills === 'number') totalKills = s.totalKills;
    if (typeof s.soundOn === 'boolean') soundOn = s.soundOn;
    if (typeof s.vibOn === 'boolean') vibOn = s.vibOn;
    if (typeof s.weapon === 'number' && s.weapon >= 0 && s.weapon < 5) selIdx = s.weapon;
  } catch (e) {}
}
function saveSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ best, bestWave, totalKills, soundOn, vibOn, weapon: selIdx })); } catch (e) {}
}

// ---------- mağaza / yükseltmeler ----------
const SHOP = [
  { key:'hp',   ad:'Maks. Sağlık', ikon:'❤', renk:'#4ade80', efekt:'+25 maks. can',      base:90,  grow:1.6,  max:12 },
  { key:'spd',  ad:'Hız',          ikon:'👟', renk:'#7dd3fc', efekt:'+%10 hareket hızı',   base:110, grow:1.65, max:8  },
  { key:'pow',  ad:'Güç',          ikon:'💪', renk:'#ff6b6b', efekt:'+%15 saldırı hasarı', base:120, grow:1.65, max:12 },
  { key:'ulti', ad:'Ulti Gücü',    ikon:'⚡', renk:'#ffd700', efekt:'+ulti hasarı, -1 şarj',base:180, grow:1.7,  max:6  }
];
function upCost(item) { return Math.round(item.base * Math.pow(item.grow, player.up[item.key])); }
function ultiNeed() { return Math.max(4, ULTI_NEED - (player ? player.up.ulti : 0)); }
function ultiDamage() { return 110 + (player ? player.up.ulti : 0) * 45; }
function recomputeStats(p) {
  const oldMax = p.maxHp || 100;
  p.maxHp = 100 + 25 * p.up.hp;
  p.hp = Math.min(p.maxHp, (p.hp == null ? p.maxHp : p.hp) + (p.maxHp - oldMax));
  p.spdMult = 1 + .10 * p.up.spd;
  p.dmgMult = 1 + .15 * p.up.pow;
}
function buyUpgrade(item) {
  const lv = player.up[item.key];
  if (lv >= item.max) { sfx('click'); return; }
  const cost = upCost(item);
  if (coins < cost) { sfx('hurt'); vib(60); addFloater(W/2, 150, 'Yetersiz altın!', '#ff6b6b', true); return; }
  coins -= cost;
  player.up[item.key]++;
  recomputeStats(player);
  addFloater(W/2, 150, item.ad + ' → Sv ' + player.up[item.key], item.renk, true);
  sfx('start'); vib(50);
}
function togglePause() {
  if (state !== 'play' && state !== 'wave') return;
  paused = !paused;
  sfx('click'); vib(30);
}

// ---------- perk (boss sonrası güçlendirme seçimi) ----------
const PERKS = [
  { key:'vamp',   ad:'Vampirlik',     ikon:'🩸', renk:'#ef4444', desc:'Vuruş hasarının %10’u kadar can çal', max:5 },
  { key:'crit',   ad:'Kritik Vuruş',  ikon:'🎯', renk:'#f59e0b', desc:'%15 şansla 2× hasar', max:5 },
  { key:'boom',   ad:'İnfilak',       ikon:'💥', renk:'#fb923c', desc:'Öldürdüğün düşman patlayıp çevreye hasar verir', max:3 },
  { key:'armor',  ad:'Zırh',          ikon:'🛡', renk:'#38bdf8', desc:'Alınan hasar %18 azalır', max:4 },
  { key:'gold',   ad:'Altın Avcısı',  ikon:'💰', renk:'#ffd54a', desc:'%40 daha fazla altın kazan', max:4 },
  { key:'haste',  ad:'Hızlı Saldırı', ikon:'💨', renk:'#a78bfa', desc:'Saldırı hızı %15 artar', max:4 },
  { key:'ultich', ad:'Ulti Şarjı',    ikon:'🔋', renk:'#22d3ee', desc:'Her vuruş ultiyi biraz doldurur', max:3 },
  { key:'range',  ad:'Uzun Erişim',   ikon:'📏', renk:'#4ade80', desc:'Saldırı erişimi %12 büyür', max:4 }
];
let perkChoices = [], pendingPerk = false;
function rollPerks() {
  const arr = PERKS.filter(pk => player.perks[pk.key] < pk.max);
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  perkChoices = arr.slice(0, 3);
}
function openPerkPick() {
  rollPerks();
  if (!perkChoices.length) { nextWave(); return; }
  state = 'perkpick';
  sfx('wave');
}
function applyPerk(pk) {
  player.perks[pk.key]++;
  addFloater(W/2, 150, pk.ikon + ' ' + pk.ad + ' → Sv ' + player.perks[pk.key], pk.renk, true);
  sfx('start'); vib(60);
  nextWave();
}

// ---------- arka plan temaları (her boss'tan sonra değişir) ----------
const THEMES = [
  { name:'Gece',        sky:['#141a33','#2b2350','#4a2b4e'], hills:'#1c1832', ground:['#242038','#15121f'], line:'#5b5380', orb:'#f5f0d8', crescent:true,  particle:'stars',     pc:'#ffffff' },
  { name:'Şafak',       sky:['#2a1a3a','#8a3a5e','#ff8c42'], hills:'#3a1f3d', ground:['#3a2840','#1d1526'], line:'#9a6a7f', orb:'#ffb347', crescent:false, particle:'none',      pc:'#ffffff' },
  { name:'Kayıp Orman', sky:['#0f2027','#203a43','#2c5364'], hills:'#12321e', ground:['#1a3a28','#0e1a14'], line:'#4a8a5f', orb:'#d8f5e0', crescent:true,  particle:'fireflies', pc:'#aaffaa' },

  };
