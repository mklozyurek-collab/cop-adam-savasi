function nextWave() {
  wave++;
  state = 'wave';
  waveTimer = wave % BOSS_EVERY === 0 ? 3 : 2.2;
  if (wave > 1) sfx(wave % BOSS_EVERY === 0 ? 'roar' : 'wave');
  if (player.hp < player.maxHp) {
    const heal = Math.min(25, player.maxHp - player.hp);
    player.hp += heal;
    if (heal > 0) addFloater(player.x, player.y-110, '+'+Math.round(heal), '#5dff8f');
  }
}

function pickEnemyType() {
  const pool = [['normal', 1]];
  if (wave >= 3) pool.push(['fast', .5]);
  if (wave >= 4) pool.push(['tank', .35]);
  if (wave >= 5) pool.push(['archer', .40]);
  if (wave >= 6) pool.push(['shield', .32]);
  if (wave >= 7) pool.push(['exploder', .34]);
  let tot = 0; for (const it of pool) tot += it[1];
  let r = Math.random() * tot;
  for (const [t, w] of pool) { if ((r -= w) <= 0) return t; }
  return 'normal';
}

function makeEnemy(type, x) {
  const stats = {
    normal:   { hp: 26 + wave*4,  spd: rand(70,95) + wave*4,    dmg: 8,  scale: 1,    color:'#ff6b6b', pts: 100 },
    fast:     { hp: 14 + wave*2,  spd: rand(150,180) + wave*4,  dmg: 6,  scale: .85,  color:'#ffb347', pts: 150 },
    tank:     { hp: 70 + wave*8,  spd: rand(45,60),             dmg: 16, scale: 1.3,  color:'#c084fc', pts: 250 },
    archer:   { hp: 20 + wave*3,  spd: rand(58,76),             dmg: 9,  scale: .95,  color:'#38bdf8', pts: 200 },
    shield:   { hp: 60 + wave*7,  spd: rand(48,64),             dmg: 12, scale: 1.15, color:'#94a3b8', pts: 220 },
    exploder: { hp: 16 + wave*2,  spd: rand(120,150) + wave*3,  dmg: 24, scale: .95,  color:'#fb923c', pts: 200 }
  }[type];
  return {
    x, y: GROUND, vx: 0, vy: 0, face: 1, onGround: true,
    hp: stats.hp, maxHp: stats.hp, spd: stats.spd, dmg: stats.dmg,
    scale: stats.scale, color: stats.color, pts: stats.pts, type,
    windup: 0, atkAnim: 0, cd: rand(0, 1.2), hurt: 0, walk: 0, dead: false, deadT: 0, kbx: 0,
    fuse: 0, shieldDir: 1, shieldTurnCd: rand(.2, .55)
  };
}

function spawnWave() {
  if (wave % BOSS_EVERY === 0) { spawnBoss(); return; }
  const n = 2 + wave;
  for (let i = 0; i < n; i++) {
    const side = Math.random() < .5 ? -1 : 1;
    const x = side < 0 ? rand(-160,-40) : rand(W+40, W+160);
    enemies.push(makeEnemy(pickEnemyType(), x));
  }
}

// patlayıcı düşman infilakı (öldüğünde/fitili bittiğinde)
function explode(e) {
  const p = player;
  addRing(e.x, e.y - 30*e.scale, '#fb923c', 150);
  addRing(e.x, e.y - 30*e.scale, '#ffe14d', 95);
  addParticles(e.x, e.y - 40*e.scale, '#fb923c', 26, 420);
  addParticles(e.x, e.y - 40*e.scale, '#ffffff88', 10, 260);
  shake = Math.max(shake, 10); punch(1.07, .07); flash = Math.max(flash, .15);
  sfx('slam'); vib(120);
  if (!p.dead && Math.abs(p.x - e.x) < 108 && Math.abs(p.y - e.y) < 115) hurtPlayer(e.dmg, Math.sign(p.x - e.x) || 1);
}

// özel düşman davranışları — true dönerse genel yakın dövüş AI atlanır
function behaviorUpdate(e, dt, p) {
  if (e.type === 'archer') {
    const dist = Math.abs(p.x - e.x);
    if (dist < 200) { e.x -= Math.sign(p.x - e.x) * e.spd * dt; e.walk += e.spd*dt*.05; }
    else if (dist > 330) { e.x += Math.sign(p.x - e.x) * e.spd * dt; e.walk += e.spd*dt*.05; }
    e.x = clamp(e.x, 20, W - 20);
    if (e.windup > 0) {
      e.windup -= dt;
      if (e.windup <= 0) { // nişan bitti → ateşle
        const px = e.x, py = e.y - 58*e.scale, tx = p.x, ty = p.y - 40;
        const dx = tx - px, dy = ty - py, d = Math.hypot(dx, dy) || 1, spd = 330;
        ebolts.push({ x: px, y: py, vx: dx/d*spd, vy: dy/d*spd - 42, dmg: e.dmg, t: 0, spin: 0, color: '#38bdf8' });
        sfx('swing'); e.atkAnim = .2; e.cd = rand(1.5, 2.4);
      }
      return true;
    }
    if (e.atkAnim > 0) { e.atkAnim -= dt; return true; }
    if (e.cd > 0) { e.cd -= dt; return true; }
    if (!p.dead) e.windup = .55; // nişan al (telegraph)
    return true;
  }

  if (e.type === 'exploder') {
    if (e.fuse > 0) {
      e.fuse -= dt;
      if (e.fuse <= 0 && !e._exploded) {
        e._exploded = true; explode(e); e.dead = true; e.deadT = 0;
        if (!enemies.some(x => x !== e && !x.dead) && state === 'play') slowmoT = Math.max(slowmoT, .5);
      }
      return true;
    }
    const dist = Math.abs(p.x - e.x);
    if (dist > 58) { e.x += Math.sign(p.x - e.x) * e.spd * dt; e.walk += e.spd*dt*.06; }
    else { e.fuse = .5; sfx('jump'); vib(40); } // fitil ateşlendi
    return true;
  }

  return false; // shield / normal / fast / tank → genel AI
}

function makeMinion(x) {
  const hp = 18 + wave*2;
  return {
    x, y: GROUND, vx: 0, vy: 0, face: 1, onGround: true,
    hp, maxHp: hp, spd: rand(85,115), dmg: 6, scale: .85,
    color: '#ffb347', pts: 120, type: 'fast',
    windup: 0, atkAnim: 0, cd: rand(0,1), hurt: 0, walk: 0, dead: false, deadT: 0, kbx: 0
  };
}

function spawnBoss() {
  const bn = Math.floor(wave / BOSS_EVERY);            // boss seviyesi: 1,2,3...
  const T = BOSS_TYPES[(bn - 1) % BOSS_TYPES.length];  // çeşit sırayla döner
  const cycle = Math.floor((bn - 1) / BOSS_TYPES.length); // kaçıncı tur
  const side = Math.random() < .5 ? -1 : 1;
  const hp = Math.round((300 + 260*(bn-1) + wave*7) * T.hpMul);
  enemies.push({
    x: side < 0 ? -120 : W + 120, y: GROUND, vx: 0, vy: 0, face: 1, onGround: true,
    hp, maxHp: hp,
    spd: T.spd + 7*bn, dmg: 16 + 6*bn,
    scale: Math.min(T.scale + .07*(bn-1), T.scale + .6),
    color: T.color, baseColor: T.color, pts: 700 + 350*bn, type: 'boss',
    isBoss: true, bossN: bn, bossType: T.special, bossAd: T.ad,
    mode: 'ground', enraged: false,
    slamCd: 3.2, blinkCd: 2.4, summonCd: 3.5, throwCd: 1.8, chargeCd: 2.4,
    chargeT: 0, chargeDir: 1, chargeSpd: 0, recCd: 0,
    windup: 0, atkAnim: 0, cd: 1, hurt: 0, walk: 0,
    dead: false, deadT: 0, kbx: 0
  });
  // çağırıcı hariç, ileri turlarda birkaç eskort
  if (T.special !== 'summon') {
    for (let i = 0; i < Math.min(cycle + (bn >= 3 ? 1 : 0), 3); i++) {
      enemies.push(makeMinion(side < 0 ? rand(-260,-160) : rand(W+160, W+260)));
    }
  }
  sfx('roar');
  vib([120, 80, 120, 80, 260]);
  shake = Math.max(shake, 8);
}

// boss yapay zekası — true dönerse normal (yürü+vur) mantığı atlanır
function bossUpdate(e, dt, p) {
  if (!e.enraged && e.hp < e.maxHp * .3) {
    e.enraged = true;
    e.spd *= 1.4;
    e.color = '#ff1f4f';
    addFloater(e.x, e.y - 150*e.scale, 'ÖFKELENDİ!', '#ff4d6d', true);
    sfx('roar'); vib(200);
  }
  const dist = Math.abs(p.x - e.x);

  switch (e.bossType) {

    case 'slam': {
      if (e.mode === 'air') {
        e.vy += 1500*dt; e.x += e.vx*dt; e.y += e.vy*dt;
        e.walk += Math.abs(e.vx)*dt*.02;
        if (e.y >= GROUND) {
          e.y = GROUND; e.vy = 0; e.vx = 0; e.mode = 'ground';
          addRing(e.x, e.y - 10, '#ff4d6d', 200); addRing(e.x, e.y - 10, '#ffffff', 130);
          addParticles(e.x, e.y - 10, '#ff6b6b', 26, 400); addParticles(e.x, e.y - 10, '#ffffff88', 12, 250);
          shake = Math.max(shake, 13); sfx('slam'); vib(170); flash = Math.max(flash, .18);
          if (!p.dead && p.onGround && Math.abs(p.x - e.x) < 185) hurtPlayer(Math.max(8, Math.round(e.dmg*.8)), Math.sign(p.x - e.x) || 1);
        }
        return true;
      }
      e.slamCd -= dt;
      if (e.slamCd <= 0 && e.windup <= 0 && e.atkAnim <= 0 && !p.dead && dist > 110) {
        e.mode = 'air'; e.vy = -580; e.vx = (p.x - e.x) / .82;
        e.slamCd = rand(5, 7) / (e.enraged ? 1.5 : 1); sfx('jump');
        return true;
      }
      return false;
    }

    case 'blink': {
      e.blinkCd -= dt;
      if (e.blinkCd <= 0 && e.windup <= 0 && e.atkAnim <= 0 && !p.dead) {
        addParticles(e.x, e.y - 50*e.scale, e.color, 18, 320);
        const sp = Math.random() < .5 ? -1 : 1;
        e.x = clamp(p.x + sp * 62, 40, W - 40);
        e.face = Math.sign(p.x - e.x) || 1;
        addParticles(e.x, e.y - 50*e.scale, '#ffffff', 18, 320);
        addRing(e.x, e.y - 50*e.scale, e.color, 70);
        e.blinkCd = rand(1.9, 3) / (e.enraged ? 1.6 : 1);
        e.windup = .32; sfx('jump'); vib(30);
        return true;
      }
      return false; // aksi halde normal yaklaş+vur
    }

    case 'summon': {
      e.summonCd -= dt;
      if (e.summonCd <= 0 && e.atkAnim <= 0 && e.windup <= 0 && !p.dead) {
        e.summonCd = rand(4.5, 6.5) / (e.enraged ? 1.5 : 1);
        const n = e.enraged ? 3 : 2;
        for (let i = 0; i < n; i++) enemies.push(makeMinion(e.x + rand(-60, 60)));
        addFloater(e.x, e.y - 150*e.scale, 'ASKER ÇAĞIRDI!', e.color, true);
        addParticles(e.x, e.y - 40*e.scale, e.color, 20, 300);
        e.atkAnim = .35; sfx('roar'); vib(90);
        return true;
      }
      return false;
    }

    case 'throw': {
      // menzili korur: çok yaklaşırsa geri çekilir, çok uzaksa yaklaşır
      if (dist < 230) { e.x -= Math.sign(p.x - e.x) * e.spd * dt; e.walk += e.spd*dt*.05; e.face = Math.sign(p.x - e.x) || 1; }
      else if (dist > 380) { e.x += Math.sign(p.x - e.x) * e.spd * dt; e.walk += e.spd*dt*.05; e.face = Math.sign(p.x - e.x) || 1; }
      e.x = clamp(e.x, 30, W - 30);
      e.throwCd -= dt;
      if (e.throwCd <= 0 && !p.dead) {
        e.throwCd = rand(1.3, 2.1) / (e.enraged ? 1.7 : 1);
        e.atkAnim = .25;
        const px = e.x, py = e.y - 62*e.scale;
        const tx = p.x, ty = p.y - 40;
        const dx = tx - px, dy = ty - py, d = Math.hypot(dx, dy) || 1, spd = 360;
        ebolts.push({ x: px, y: py, vx: dx/d*spd, vy: dy/d*spd - 55, dmg: Math.max(6, Math.round(e.dmg*.65)), t: 0, spin: 0, color: e.color });
        sfx('swing'); addParticles(px, py, e.color, 6, 160);
      }
      return true; // her zaman özel (yakın dövüş yok)
    }

    case 'charge': {
      if (e.mode === 'charge') {
        e.x += e.chargeDir * e.chargeSpd * dt;
        e.walk += e.chargeSpd*dt*.06;
        if (Math.random() < .5) addParticles(e.x, e.y - 30*e.scale, e.color, 2, 120);
        if (!p.dead && Math.abs(p.x - e.x) < 42*e.scale && Math.abs(p.y - e.y) < 90) {
          hurtPlayer(e.dmg, e.chargeDir); e.mode = 'recover'; e.recCd = .7;
        }
        e.chargeT -= dt;
        if (e.chargeT <= 0 || e.x < 42 || e.x > W - 42) { e.mode = 'recover'; e.recCd = .6; e.x = clamp(e.x, 42, W - 42); }
        return true;
      }
      if (e.mode === 'recover') { e.recCd -= dt; if (e.recCd <= 0) e.mode = 'ground'; return true; }
      e.chargeCd -= dt;
      if (e.chargeCd <= 0 && !p.dead && dist > 130) {
        e.mode = 'charge'; e.chargeDir = Math.sign(p.x - e.x) || 1; e.face = e.chargeDir;
        e.chargeSpd = 520 * (e.enraged ? 1.3 : 1); e.chargeT = 1.3;
        e.chargeCd = rand(2.4, 3.4) / (e.enraged ? 1.5 : 1);
        addParticles(e.x, e.y - 40*e.scale, e.color, 12, 220); sfx('jump'); vib(40);
        return true;
      }
      return false;
    }
  }
  return false;
}

// ---------- efektler ----------
function addParticles(x, y, color, n, pow) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI*2), s = rand(40, pow);
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 60, life: rand(.3,.7), t: 0, color, r: rand(1.5,3.5) });
  }
}
function addFloater(x, y, text, color, big) {
  floaters.push({ x, y, text, color, t: 0, big: !!big });
}
function addRing(x, y, color, max) {
  rings.push({ x, y, color, max, t: 0, dur: .5 });
}

// ---------- saldırılar ----------
function tryAttack(type) {
  const p = player;
  if (p.atk || p.dead || ulti) return;
  if (type === 'punch') { if (p.punchCd > 0) return; }
  else                  { if (p.atkCd   > 0) return; }
  p.atk = { type, t: 0, hitDone: false };
  sfx(type === 'punch' ? 'punch' : 'swing');
}

function attackDef(type) {
  return type === 'punch' ? PUNCH : player.weapon;
}

function doHits(def, aoe) {
  const p = player;
  const rmul = 1 + .12 * (p.perks.range || 0); // menzil perki
  let hitAny = false;
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = e.x - p.x;
    const dirOk = aoe ? true : dx * p.face > -20;
    const inRange = Math.abs(dx) < (def.range * Math.max(e.scale, 1) + 14) * rmul && dirOk;
    const inHeight = Math.abs(e.y - p.y) < def.hgt * rmul;
    if (inRange && inHeight) {
      hitAny = true;
      // kalkanlı düşman: önden vuruşta hasar %25'e düşer, arkadan tam
      const blocked = e.type === 'shield' && (Math.sign(p.x - e.x) || 1) === e.shieldDir;
      let dmg = Math.round(def.dmg * p.dmgMult);
      let crit = false;
      if (p.perks.crit && Math.random() < Math.min(.6, .15 * p.perks.crit)) { dmg = Math.round(dmg * 2); crit = true; }
      if (blocked) dmg = Math.max(1, Math.round(dmg * .25));
      e.hp -= dmg;
      e.hurt = .18;
      e.kbx = (aoe ? Math.sign(dx || 1) : p.face) * def.kb / e.scale * (e.isBoss ? .22 : blocked ? .3 : 1);
      addParticles(e.x, e.y - 55*e.scale, blocked ? '#9fc7ff' : '#fff', blocked ? 5 : 8, blocked ? 120 : 200);
      addParticles(e.x, e.y - 55*e.scale, e.color, 6, 160);
      if (blocked) addFloater(e.x, e.y - 105*e.scale, 'BLOK', '#9fc7ff');
      else addFloater(e.x, e.y - 105*e.scale, (crit ? '💥' : '') + dmg, crit ? '#ff8c42' : '#ffe14d');
      // vampirlik perki
      if (!blocked && p.perks.vamp && p.hp < p.maxHp) p.hp = Math.min(p.maxHp, p.hp + dmg * .10 * p.perks.vamp);
      shake = Math.max(shake, dmg > 20 ? 6 : dmg > 10 ? 4 : 2);
      punch(1 + clamp(dmg*.002, .02, crit ? .09 : .06), clamp(.02 + dmg*.0025, .03, crit ? .12 : .09));
      if (blocked) sfx('spearhit');
      if (e.hp <= 0) killEnemy(e, false);
    }
  }
  if (hitAny) {
    combo++; comboTimer = 2; sfx('hit'); vib(25);
    // ulti şarjı perki: vuruş başına ulti dolar
    if (p.perks.ultich && !ultiReady) {
      ultiKills += .25 * p.perks.ultich;
      if (ultiKills >= ultiNeed()) { ultiReady = true; addFloater(player.x, player.y - 150, '⚡ ULTİ HAZIR!', '#ffd700', true); }
    }
  }
}

function killEnemy(e, fromUlti) {
  e.dead = true; e.deadT = 0;
  kills++;
  // patlayıcı öldüğünde infilak eder (yakın dövüşle öldürmek riskli)
  if (e.type === 'exploder' && !e._exploded) { e._exploded = true; explode(e); }
  // İNFİLAK perki: öldürülen düşman çevreye hasar yayar
  if (player.perks.boom && !e.isBoss) {
    const rad = 90 + 30*player.perks.boom, bdmg = 20 + 15*player.perks.boom;
    addRing(e.x, e.y - 40*e.scale, '#fb923c', rad);
    addParticles(e.x, e.y - 40*e.scale, '#fb923c', 14, 320);
    for (const o of enemies) {
      if (o === e || o.dead || o.isBoss) continue;
      if (Math.abs(o.x - e.x) < rad && Math.abs(o.y - e.y) < 120) {
        o.hp -= bdmg; o.hurt = .15;
        if (o.hp <= 0) killEnemy(o, true);
      }
    }
    sfx('slam');
  }
  // son düşman öldüyse kısa ağır çekim gösterisi
  if (!enemies.some(x => x !== e && !x.dead) && (state === 'play' || state === 'wave')) slowmoT = Math.max(slowmoT, .5);
  const mult = fromUlti ? 1 : 1 + Math.min(combo, 20) * .1;
  const pts = Math.round(e.pts * mult);
  score += pts;
  let cGain = e.isBoss ? 50 + 20*e.bossN : Math.max(2, Math.round(e.pts / 28));
  if (player.perks.gold) cGain = Math.round(cGain * (1 + .4 * player.perks.gold)); // altın avcısı perki
  coins += cGain;
  addFloater(e.x, e.y - 130*e.scale, '+' + pts, fromUlti ? '#ffd700' : '#5dff8f');
  if (e.isBoss) addFloater(e.x + 26, e.y - 96*e.scale, '🪙' + cGain, '#ffd54a');
  addParticles(e.x, e.y - 55*e.scale, e.color, fromUlti ? 30 : 18, fromUlti ? 420 : 280);
  if (e.isBoss) {
    addFloater(W/2, 200, '☠ BOSS ALT EDİLDİ! ☠', '#ffd700', true);
    const nextT = THEMES[Math.floor(wave / BOSS_EVERY) % THEMES.length];
    addFloater(W/2, 250, '🌍 Yeni bölge: ' + nextT.name, '#7dd3fc', true);
    addRing(e.x, e.y - 60*e.scale, '#ffd700', 240);
    addRing(e.x, e.y - 60*e.scale, '#ff4d6d', 170);
    addParticles(e.x, e.y - 60*e.scale, '#ffd700', 40, 500);
    const heal = Math.min(40, player.maxHp - player.hp);
    if (heal > 0) { player.hp += heal; addFloater(player.x, player.y - 120, '+' + heal, '#5dff8f'); }
    shake = Math.max(shake, 12);
    punch(1.1, .14);
    pendingPerk = true; // boss temizlenince güçlendirme seçtir
    sfx('bossdie'); vib([90, 60, 90, 60, 240]);
  } else if (!fromUlti) {
    sfx('kill'); vib(35);
    punch(1.05, .05);
  }
  if (!fromUlti && !ultiReady) {
    ultiKills++;
    if (ultiKills >= ultiNeed()) {
      ultiReady = true;
      addFloater(player.x, player.y - 150, '⚡ ULTİ HAZIR!', '#ffd700', true);
    }
  }
}

function hurtPlayer(dmg, dir) {
  const p = player;
  if (p.inv > 0 || p.dead || ulti) return;
  if (p.perks && p.perks.armor) dmg = Math.max(1, Math.round(dmg * (1 - .18 * p.perks.armor))); // zırh perki
  p.hp -= dmg;
  p.hurt = .25; p.inv = .6;
  p.vx = dir * 300; p.vy = -180; p.onGround = false;
  combo = 0;
  shake = Math.max(shake, 6);
  addParticles(p.x, p.y - 55, '#ff5555', 12, 220);
  addFloater(p.x, p.y - 110, '-' + dmg, '#ff6b6b');
  punch(1.06, .06);
  sfx('hurt'); vib(120);
  if (p.hp <= 0) {
    p.hp = 0; p.dead = true;
    newRecord = score > best;
    best = Math.max(best, score);
    bestWave = Math.max(bestWave, wave);
    totalKills += kills;
    saveSave();
    sfx('gameover'); vib([80, 60, 80, 60, 300]);
    setTimeout(() => { if (player && player.dead) state = 'gameover'; }, 900);
  }
}

// ---------- ULTİ ----------
function tryUlti() {
  if (!ultiReady || ulti || state !== 'play' || player.dead) return;
  const targets = enemies.filter(e => !e.dead);
  if (!targets.length) return;
  ultiReady = false; ultiKills = 0;
  const type = WKEYS[selIdx];
  ulti = { t: 0, targets, idx: 0, type };
  timeScale = .22;
  flash = 1;
  shake = 10;
  const U = ULTIS[type];
  addFloater(player.x, player.y - 160, U.ad, U.renk, true);
  switch (type) {
    case 'kisa':   sfx('ulti_kisa');   vib([40,30,40,30,40,30,120]); break;
    case 'uzun':   sfx('ulti');        vib([60,40,60,40,300]); break;
    case 'balta':  sfx('ulti_balta');  vib([200,60,200,60,400]);
                   crack = { t: 0, x: player.x }; break;
    case 'gurz':   sfx('ulti_gurz');   vib([80,50,80,50,80,50,250]); break;
    case 'mizrak': sfx('ulti_mizrak'); vib([30,20,30,20,30,20,30,20,150]); break;
  }
}

// ulti artık sabit kill değil, hasar verir — güçlü/ileri düşmanlar tek atılmaz
function ultiHit(e) {
  const dmg = ultiDamage();
  if (e.isBoss) {
    // boss'a ulti hasarı en fazla maksimum canının yarısı
    const d = Math.min(dmg, Math.round(e.maxHp * .5));
    e.hp -= d; e.hurt = .3;
    addFloater(e.x, e.y - 150*e.scale, d, '#ffd700');
    if (e.hp <= 0) killEnemy(e, true);
  } else {
    e.hp -= dmg; e.hurt = .25;
    addFloater(e.x, e.y - 150*e.scale, dmg, '#ffd700');
    if (e.hp <= 0) killEnemy(e, true);
    else e.kbx = (e.x < player.x ? -1 : 1) * 240 / e.scale; // sağ kalırsa geri savrulur
  }
  shake = Math.max(shake, 8);
  flash = Math.max(flash, .4);
}

// hedefe silaha özel ulti vuruşu
function strikeTarget(e) {
  const p = player;
  switch (ulti.type) {
    case 'kisa': { // hayalet dilim: düşmanın içinden geçerek dilimle
      ghosts.push({ x: p.x, y: p.y, face: p.face, t: 0 });
      const dir = e.x >= p.x ? 1 : -1;
      p.x = clamp(e.x + dir*38, 25, W-25);
      p.y = GROUND; p.vy = 0; p.onGround = true;
      p.face = -dir;
      slashes.push({ x: e.x, y: e.y - 55*e.scale, ang: rand(-.7,-.2), t: 0 });
      slashes.push({ x: e.x, y: e.y - 55*e.scale, ang: rand(.4,.9), t: 0 });
      addParticles(e.x, e.y - 55*e.scale, '#7dfcff', 16, 320);
      addRing(e.x, e.y - 50*e.scale, '#7dfcff', 60);
      ultiHit(e);
      sfx('slash'); vib(35);
      break;
    }
    case 'uzun': { // gökten yıldırım
      bolts.push({ x: e.x, y: e.y - 50*e.scale, t: 0, segs: makeBolt(e.x, e.y - 50*e.scale) });
      addRing(e.x, e.y - 40*e.scale, '#ffd700', 90);
      addRing(e.x, e.y - 40*e.scale, '#ffffff', 55);
      addParticles(e.x, e.y - 55*e.scale, '#ffd700', 22, 380);
      ultiHit(e);
      sfx('bolt'); vib(45);
      break;
    }
    case 'balta': { // deprem: yerden kaya fışkırması
      quakes.push({ x: e.x, t: 0 });
      addParticles(e.x, e.y - 20, '#8d6e63', 18, 340);
      addParticles(e.x, e.y - 30, '#d7ccc8', 8, 260);
      addRing(e.x, e.y - 8, '#ff9d47', 80);
      ultiHit(e);
      sfx('quakehit'); vib(70);
      shake = Math.max(shake, 11);
      break;
    }
    case 'gurz': { // meteor çağır — çarpış updateFx'te
      meteors.push({ sx: e.x - 300 + rand(-80, 80), sy: -60, e, t: 0, dur: .4, hit: false });
      sfx('meteor');
      break;
    }
    case 'mizrak': { // gökten mızrak — saplanma updateFx'te
      spearsFx.push({ e, x: e.x, t: 0, dur: .22, hit: false });
      sfx('spear');
      break;
    }
  }
}

function updateUlti(dt) { // dt = gerçek zaman
  if (!ulti) return;
  ulti.t += dt;
  const step = ulti.type === 'kisa' ? .12 : .16;
  while (ulti.idx < ulti.targets.length && ulti.t > .35 + ulti.idx * step) {
    const e = ulti.targets[ulti.idx++];
    if (!e.dead) strikeTarget(e);
  }
  const tail = ulti.type === 'gurz' ? 1 : ulti.type === 'mizrak' ? .8 : .55;
  const doneAt = .35 + ulti.targets.length * step + tail;
  // yavaş çekimden çıkış
  if (ulti.t > doneAt - .4) timeScale = lerp(timeScale, 1, Math.min(1, dt*6));
  if (ulti.t > doneAt) { ulti = null; timeScale = 1; }
}

function makeBolt(tx, ty) {
  const segs = [];
  let x = tx + rand(-70, 70), y = -20;
  segs.push([x, y]);
  const n = 7;
  for (let i = 1; i < n; i++) {
    const t = i / n;
    x = lerp(x, tx, t) + rand(-34, 34) * (1 - t);
    y = lerp(-20, ty, t);
    segs.push([x, y]);
  }
  segs.push([tx, ty]);
  return segs;
}

// ---------- güncelleme ----------
function update(rdt) {
  tGlobal += rdt;
  if (paused) return;
  if (shake > 0) shake = Math.max(0, shake - rdt*30);
  if (flash > 0) flash = Math.max(0, flash - rdt*2.2);
  if (slowmoT > 0) slowmoT -= rdt;
  updateUlti(rdt);
  const eff = ulti ? timeScale : (slowmoT > 0 ? 0.32 : 1); // dalga temizleme ağır çekimi
  const dt = rdt * eff;

  if (state === 'select' || state === 'gameover' || state === 'perkpick') { updateFx(rdt); return; }

  if (state === 'wave') {
    waveTimer -= dt;
    if (waveTimer <= 0) { spawnWave(); state = 'play'; }
  }

  const p = player;

  // --- oyuncu ---
  if (!p.dead) {
    const left  = keys['ArrowLeft']  || keys['KeyA'];
    const right = keys['ArrowRight'] || keys['KeyD'];
    const jumpDown = keys['ArrowUp'] || keys['KeyW'] || keys['Space'];
    const dashDown = keys['ShiftLeft'] || keys['ShiftRight'] || keys['KeyL'] || keys['KeyC'];

    // DASH (kaçış) — kısa süreli dokunulmazlık
    if (dashDown && !dashPrev && p.dashCd <= 0 && p.dashT <= 0) {
      p.dashT = .16; p.dashCd = .55;
      p.dashDir = (left && !right) ? -1 : (right && !left) ? 1 : p.face;
      p.face = p.dashDir;
      p.inv = Math.max(p.inv, .3);
      sfx('jump'); vib(30);
      addParticles(p.x, p.y - 40, '#7dd3fc', 10, 220);
    }
    dashPrev = dashDown;

    if (p.dashT > 0) {
      p.dashT -= dt;
      p.vx = p.dashDir * 620;
      if (Math.floor(p.dashT * 60) % 2 === 0) ghosts.push({ x: p.x, y: p.y, face: p.face, t: 0 });
    } else {
      const acc = (p.onGround ? 2200 : 1200) * p.spdMult;
      const maxV = 260 * p.spdMult;
      if (left && !right)  { p.vx = Math.max(p.vx - acc*dt, -maxV); p.face = -1; }
      else if (right && !left) { p.vx = Math.min(p.vx + acc*dt, maxV); p.face = 1; }
      else p.vx *= p.onGround ? Math.pow(.0001, dt) : Math.pow(.2, dt);
    }
    if (p.dashCd > 0) p.dashCd -= dt;

    // coyote time + zıplama tamponu
    if (p.onGround) p.coyote = .1; else if (p.coyote > 0) p.coyote -= dt;
    if (jumpDown && !p.jumpHeld) p.jumpBuf = .12;
    p.jumpHeld = jumpDown;
    if (p.jumpBuf > 0) p.jumpBuf -= dt;
    if (p.jumpBuf > 0 && (p.onGround || p.coyote > 0) && p.dashT <= 0) {
      p.vy = -560; p.onGround = false; p.coyote = 0; p.jumpBuf = 0;
      addParticles(p.x, p.y, '#ffffff55', 6, 90);
      sfx('jump');
    }
    // değişken zıplama yüksekliği: tuş erken bırakılırsa yükseliş kesilir
    if (!jumpDown && p.vy < -180) p.vy = -180;

    if (keys['KeyJ'] || keys['KeyZ']) tryAttack('punch');
    if (keys['KeyK'] || keys['KeyX']) tryAttack('weapon');
    if (keys['KeyU']) tryUlti();
  }

  p.vy += (p.vy > 0 ? 1900 : 1500) * dt; // düşerken daha ağır yerçekimi = daha iyi his
  p.x = clamp(p.x + p.vx*dt, 25, W-25);
  p.y += p.vy*dt;
  if (p.y >= GROUND) { p.y = GROUND; p.vy = 0; p.onGround = true; }
  p.walk += Math.abs(p.vx)*dt*.055;
  if (p.atkCd > 0) p.atkCd -= dt;
  if (p.punchCd > 0) p.punchCd -= dt;
  if (p.hurt > 0) p.hurt -= rdt;
  if (p.inv > 0) p.inv -= rdt;
  // gecikmeli can barı takibi
  if (hpChip < p.hp) hpChip = p.hp;
  else if (hpChip > p.hp) hpChip = Math.max(p.hp, hpChip - Math.max(35, (hpChip - p.hp) * 3) * rdt);

  // saldırı işleme
  if (p.atk) {
    const def = attackDef(p.atk.type);
    p.atk.t += dt;
    if (!p.atk.hitDone && p.atk.t >= def.hitT) {
      p.atk.hitDone = true;
      doHits(def, p.atk.type === 'weapon' && p.weapon.aoe);
    }
    if (p.atk.t >= def.dur) {
      const cdMul = Math.max(.4, 1 - .15 * (p.perks.haste || 0)); // hızlı saldırı perki
      if (p.atk.type === 'punch') p.punchCd = def.cd * cdMul;
      else p.atkCd = def.cd * cdMul;
      p.atk = null;
    }
  }

  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }

  // --- düşmanlar ---
  for (const e of enemies) {
    if (e.dead) { e.deadT += dt; continue; }
    const dx = p.x - e.x;
    e.face = dx >= 0 ? 1 : -1;

    if (e.isBoss && bossUpdate(e, dt, p)) {
      if (e.hurt > 0) e.hurt -= rdt;
      continue;
    }

    if (Math.abs(e.kbx) > 1) {
      e.x += e.kbx * dt;
      e.kbx *= Math.pow(.005, dt);
    }

    if (!e.isBoss && behaviorUpdate(e, dt, p)) { if (e.hurt > 0) e.hurt -= rdt; continue; }

    // kalkanlı: kalkan yönü yavaş döner → oyuncu arkasına geçip vurabilir
    if (e.type === 'shield') {
      e.shieldTurnCd -= dt;
      if (e.shieldTurnCd <= 0) { e.shieldDir = Math.sign(dx) || 1; e.shieldTurnCd = .55; }
    }

    const reach = 52 * e.scale;
    if (e.windup > 0) {
      e.windup -= dt;
      if (e.windup <= 0) {
        e.atkAnim = .25;
        if (Math.abs(p.x - e.x) < reach + 22 && Math.abs(p.y - e.y) < 80 && !p.dead) hurtPlayer(e.dmg, e.face);
        e.cd = rand(.9, 1.5);
      }
    } else if (e.atkAnim > 0) {
      e.atkAnim -= dt;
    } else if (e.cd > 0) {
      e.cd -= dt;
    } else if (Math.abs(dx) > reach) {
      e.x += Math.sign(dx) * e.spd * dt;
      e.walk += e.spd * dt * .055;
    } else if (!p.dead) {
      e.windup = .45;
    }
    if (e.hurt > 0) e.hurt -= rdt;
  }

  enemies = enemies.filter(e => !e.dead || e.deadT < 1.2);

  if (state === 'play' && enemies.length === 0 && !ulti) {
    if (pendingPerk) { pendingPerk = false; openPerkPick(); }
    else nextWave();
  }

  updateFx(rdt);
}

function updateFx(dt) {
  for (const pt of particles) {
    pt.t += dt;
    pt.x += pt.vx*dt; pt.y += pt.vy*dt;
    pt.vy += 700*dt;
  }
  particles = particles.filter(pt => pt.t < pt.life);
  for (const f of floaters) { f.t += dt; f.y -= 45*dt; }
  floaters = floaters.filter(f => f.t < (f.big ? 1.6 : 1));
  for (const b of bolts) b.t += dt;
  bolts = bolts.filter(b => b.t < .3);
  for (const r of rings) r.t += dt;
  rings = rings.filter(r => r.t < r.dur);
  for (const s of slashes) s.t += dt;
  slashes = slashes.filter(s => s.t < .25);
  for (const g of ghosts) g.t += dt;
  ghosts = ghosts.filter(g => g.t < .4);
  for (const q of quakes) q.t += dt;
  quakes = quakes.filter(q => q.t < .55);
  if (crack) { crack.t += dt; if (crack.t > 1.6) crack = null; }
  // meteorlar: düşerken hedefi izler, çarpınca patlar
  for (const m of meteors) {
    m.t += dt;
    if (!m.hit && m.t >= m.dur) {
      m.hit = true;
      const tx = m.e.x, ty = m.e.y - 20*m.e.scale;
      addRing(tx, ty, '#ff8c42', 115);
      addRing(tx, ty, '#ffd700', 70);
      addParticles(tx, ty, '#ff8c42', 26, 430);
      addParticles(tx, ty, '#ffe14d', 12, 300);
      sfx('meteorhit'); vib(75);
      if (!m.e.dead) ultiHit(m.e);
      shake = Math.max(shake, 10);
    }
  }
  meteors = meteors.filter(m => m.t < m.dur + .05);
  // mızraklar: düşer, saplanır, bir süre yerde kalır
  for (const s of spearsFx) {
    s.t += dt;
    if (!s.hit && s.t >= s.dur) {
      s.hit = true;
      s.x = s.e.x;
      addRing(s.x, s.e.y - 30*s.e.scale, '#9fd8ff', 65);
      addParticles(s.x, s.e.y - 40*s.e.scale, '#9fd8ff', 14, 300);
      sfx('spearhit'); vib(40);
      if (!s.e.dead) ultiHit(s.e);
    }
  }
  spearsFx = spearsFx.filter(s => s.t < s.dur + .9);
  // boss mermileri
  for (const b of ebolts) {
    b.t += dt; b.spin += dt * 12;
    b.vy += 620 * dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (!player.dead && player.inv <= 0 &&
        Math.abs(b.x - player.x) < 26 && Math.abs(b.y - (player.y - 45)) < 55) {
      hurtPlayer(b.dmg, Math.sign(b.vx) || 1);
      b.t = 99;
      addParticles(b.x, b.y, b.color, 10, 200);
    }
  }
  ebolts = ebolts.filter(b => b.t < 4 && b.y < GROUND + 20 && b.x > -40 && b.x < W + 40);
}

// ---------- silah çizimi ----------
function drawWeapon(wp, hx, hy, ang) {
  // ang: bıçağın yönü (0 = yukarı, + ileri doğru döner)
  const dx = Math.sin(ang), dy = -Math.cos(ang);
  const px = -dy, py = dx; // dik vektör
  const L = wp.len;
  if (wp.draw === 'sword') {
    const grad = ctx.createLinearGradient(hx, hy, hx+dx*L, hy+dy*L);
    grad.addColorStop(0, '#9fd8ff'); grad.addColorStop(1, '#ffffff');
    ctx.strokeStyle = grad; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx+dx*L, hy+dy*L); ctx.stroke();
    ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(hx+dx*6-px*6, hy+dy*6-py*6); ctx.lineTo(hx+dx*6+px*6, hy+dy*6+py*6);
    ctx.stroke();
  } else if (wp.draw === 'axe') {
    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx+dx*L, hy+dy*L); ctx.stroke();
    const tx = hx+dx*L, ty = hy+dy*L;
    ctx.fillStyle = '#cfd8dc';
    ctx.beginPath();
    ctx.moveTo(tx - dx*10, ty - dy*10);
    ctx.quadraticCurveTo(tx + px*26 + dx*4, ty + py*26 + dy*4, tx + dx*14, ty + dy*14);
    ctx.quadraticCurveTo(tx + px*12, ty + py*12, tx - dx*10, ty - dy*10);
    ctx.fill();
  } else if (wp.draw === 'mace') {
    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx+dx*L, hy+dy*L); ctx.stroke();
    const tx = hx+dx*(L+4), ty = hy+dy*(L+4);
    ctx.fillStyle = '#78909c';
    ctx.beginPath(); ctx.arc(tx, ty, 10, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#b0bec5'; ctx.lineWidth = 3;
    for (let i = 0; i < 6; i++) {
      const a = i*Math.PI/3 + .3;
      ctx.beginPath();
      ctx.moveTo(tx + Math.cos(a)*9, ty + Math.sin(a)*9);
      ctx.lineTo(tx + Math.cos(a)*15, ty + Math.sin(a)*15);
      ctx.stroke();
    }
  } else if (wp.draw === 'spear') {
    ctx.strokeStyle = '#a1887f'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(hx - dx*14, hy - dy*14); ctx.lineTo(hx+dx*L, hy+dy*L); ctx.stroke();
    const tx = hx+dx*L, ty = hy+dy*L;
    ctx.fillStyle = '#e8f7ff';
    ctx.beginPath();
    ctx.moveTo(tx + dx*14, ty + dy*14);
    ctx.lineTo(tx + px*5, ty + py*5);
    ctx.lineTo(tx - px*5, ty - py*5);
    ctx.closePath(); ctx.fill();
  }
}

// ---------- çöp adam ----------
function drawStick(x, y, face, scale, color, pose, weapon) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(face*scale, scale);

  let fall = 0;
  if (pose.dead) {
    fall = Math.min(1, pose.deadT * 3.2);
    ctx.globalAlpha = clamp(1 - (pose.deadT - .5)/.7, 0, 1);
    ctx.rotate(fall * Math.PI/2 * .92);
    ctx.translate(0, fall * 8);
  }

  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const lean = pose.lean || 0;
  const hipX = lean*6, hipY = -34;
  const neckX = lean*14, neckY = -66;
  const headY = neckY - 12;

  const wp = pose.walk || 0;
  const airborne = pose.air;
  let l1 = Math.sin(wp)*.7, l2 = Math.sin(wp + Math.PI)*.7;
  if (airborne) { l1 = .8; l2 = -.4; }
  const drawLeg = (sw) => {
    const kx = hipX + Math.sin(sw)*14, ky = hipY + 17;
    const fx = kx + Math.sin(sw*.6)*10, fy = 0;
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(kx, ky);
    ctx.lineTo(fx, fy);
    ctx.stroke();
  };
  drawLeg(l1); drawLeg(l2);

  ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(neckX, neckY); ctx.stroke();
  ctx.beginPath(); ctx.arc(neckX + lean*3, headY, 11, 0, Math.PI*2); ctx.stroke();

  // boss boynuzları + kızgın gözler
  if (pose.boss) {
    const hcx = neckX + lean*3;
    ctx.beginPath();
    ctx.moveTo(hcx - 7, headY - 8); ctx.lineTo(hcx - 13, headY - 20);
    ctx.moveTo(hcx + 7, headY - 8); ctx.lineTo(hcx + 13, headY - 20);
    ctx.stroke();
    ctx.fillStyle = '#ffdd00';
    ctx.beginPath(); ctx.arc(hcx + 4, headY - 2, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hcx - 3, headY - 2, 2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = color;
  }

  const shX = lerp(hipX, neckX, .85), shY = lerp(hipY, neckY, .85);

  // ARKA KOL — yumruk kolu (diğer el)
  if (pose.punch != null) {
    // ileri jab: pr 0→1→0
    const pr = Math.sin(Math.min(1, pose.punch) * Math.PI);
    const ex = shX + 8 + pr*10, ey = shY + 12 - pr*8;
    const hx2 = shX + 10 + pr*26, hy2 = shY + 12 - pr*14;
    ctx.beginPath();
    ctx.moveTo(shX, shY); ctx.lineTo(ex, ey); ctx.lineTo(hx2, hy2);
    ctx.stroke();
    // yumruk topuzu
    ctx.beginPath(); ctx.arc(hx2, hy2, 4.5, 0, Math.PI*2); ctx.fill();
    if (pr > .5) { // vuruş izi
      ctx.globalAlpha = (pr-.5)*1.4;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(hx2-14, hy2-3); ctx.lineTo(hx2+7, hy2-3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hx2-11, hy2+4); ctx.lineTo(hx2+5, hy2+4); ctx.stroke();
      ctx.globalAlpha = pose.dead ? ctx.globalAlpha : 1;
      ctx.lineWidth = 5;
    }
  } else {
    const backSw = airborne ? -.9 : Math.sin(wp + Math.PI)*.5 - .3;
    ctx.beginPath();
    ctx.moveTo(shX, shY);
    ctx.lineTo(shX + Math.sin(backSw)*13 - 4, shY + Math.cos(backSw)*13);
    ctx.lineTo(shX + Math.sin(backSw)*20 - 10, shY + Math.cos(backSw)*22);
    ctx.stroke();
  }

  // ÖN KOL — silah kolu
  let armA;
  if (pose.windup > 0) armA = -1.9;
  else if (pose.atkArm != null) armA = pose.atkArm;
  else armA = airborne ? .9 : Math.sin(wp)*.5 + .3;
  const ex = shX + Math.sin(armA)*15, ey = shY + Math.cos(armA)*15;
  const hx = shX + Math.sin(armA)*30, hy = shY + Math.cos(armA)*26 - Math.abs(Math.sin(armA))*8;
  ctx.beginPath();
  ctx.moveTo(shX, shY); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy);
  ctx.stroke();

  if (weapon) drawWeapon(weapon, hx, hy, armA + .35);

  ctx.restore();
}

// ---------- arkaplan (tema tabanlı) ----------
function drawBg() {
  const T = curTheme();
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, T.sky[0]);
  sky.addColorStop(.6, T.sky[1]);
  sky.addColorStop(1, T.sky[2]);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, GROUND);

  // gök cismi (ay / güneş)
  ctx.save();
  if (!T.crescent) { ctx.shadowColor = T.orb; ctx.shadowBlur = 40; }
  ctx.fillStyle = T.orb;
  ctx.beginPath(); ctx.arc(790, 95, 34, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  if (T.crescent) {
    ctx.fillStyle = T.sky[1];
    ctx.beginPath(); ctx.arc(803, 86, 30, 0, Math.PI*2); ctx.fill();
  }

  // tema parçacıkları
  if (T.particle !== 'none') {
    ctx.fillStyle = T.pc;
    for (let i = 0; i < 40; i++) {
      let sx, sy, r = 2, a;
      if (T.particle === 'stars') {
        sx = (i*211.7) % W; sy = (i*137.3) % (GROUND*.6);
        a = (.4 + .6*Math.abs(Math.sin(tGlobal*1.5 + i))) * .8;
      } else if (T.particle === 'snow') {
        sx = ((i*211.7 + Math.sin(tGlobal + i)*40) % W + W) % W;
        sy = (i*137.3 + tGlobal*42) % GROUND;
        a = .7; r = 2.5;
      } else if (T.particle === 'embers') {
        sx = ((i*211.7 + Math.sin(tGlobal*2 + i)*22) % W + W) % W;
        sy = GROUND - ((i*97.3 + tGlobal*55) % GROUND);
        a = .5 + .5*Math.abs(Math.sin(tGlobal*3 + i)); r = 2;
      } else { // fireflies
        sx = ((i*211.7 + Math.sin(tGlobal*.8 + i)*24) % W + W) % W;
        sy = GROUND - 20 - (i*53 % 200) + Math.sin(tGlobal*1.3 + i*2)*12;
        a = .3 + .7*Math.abs(Math.sin(tGlobal*2 + i*1.7)); r = 2.2;
      }
      ctx.globalAlpha = a;
      ctx.fillRect(sx, sy, r, r);
    }
    ctx.globalAlpha = 1;
  }

  // tepeler
  ctx.fillStyle = T.hills;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 40) ctx.lineTo(x, GROUND - 60 - Math.sin(x*.011)*38 - Math.sin(x*.027)*16);
  ctx.lineTo(W, GROUND);
  ctx.fill();

  // zemin
  const gr = ctx.createLinearGradient(0, GROUND, 0, H);
  gr.addColorStop(0, T.ground[0]);
  gr.addColorStop(1, T.ground[1]);
  ctx.fillStyle = gr;
  ctx.fillRect(0, GROUND, W, H-GROUND);
  ctx.strokeStyle = T.line;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();

  // deprem çatlağı (balta ultisi)
  if (crack) {
    const pr = Math.min(1, crack.t * 2);
    const reach = pr * W;
    ctx.strokeStyle = 'rgba(20,10,5,' + (crack.t < 1 ? .9 : .9*(1-(crack.t-1)/.6)) + ')';
    ctx.lineWidth = 5;
    for (const dir of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(crack.x, GROUND + 4);
      let cx = crack.x, cy = GROUND + 4, i = 0;
      while (Math.abs(cx - crack.x) < reach && cx > -20 && cx < W+20) {
        cx += dir * 34;
        cy = GROUND + 4 + ((i*73 + Math.floor(crack.x)) % 17) - 4;
        ctx.lineTo(cx, cy);
        i++;
      }
      ctx.stroke();
    }
  }
}

// ---------- HUD ----------
function drawHud() {
  const p = player;
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillRect(18, 16, 264, 26);
  // gecikmeli "hasar" barı (chip) — son alınan hasarı kırmızı gösterir
  if (hpChip > p.hp) {
    ctx.fillStyle = 'rgba(255,90,90,.75)';
    ctx.fillRect(20, 18, 260 * clamp(hpChip/p.maxHp, 0, 1), 22);
  }
  ctx.fillStyle = p.hp/p.maxHp > .35 ? '#4ade80' : '#ff4d6d';
  ctx.fillRect(20, 18, 260 * clamp(p.hp/p.maxHp, 0, 1), 22);
  ctx.strokeStyle = '#ffffff88'; ctx.lineWidth = 2;
  ctx.strokeRect(18, 16, 264, 26);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px Segoe UI, Arial';
  ctx.textAlign = 'left';
  ctx.fillText('CAN ' + Math.ceil(p.hp), 26, 34);

  // ULTİ göstergesi
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillRect(18, 48, 264, 12);
  const uw = 260 * (ultiReady ? 1 : clamp(ultiKills/ultiNeed(), 0, 1));
  ctx.fillStyle = ultiReady ? `rgba(255,215,0,${.7 + .3*Math.abs(Math.sin(tGlobal*5))})` : '#b8960c';
  ctx.fillRect(20, 50, uw, 8);
  ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 1;
  ctx.strokeRect(18, 48, 264, 12);
  ctx.font = 'bold 12px Segoe UI, Arial';
  ctx.fillStyle = ultiReady ? '#ffd700' : '#ffffff99';
  ctx.fillText(ultiReady ? (isTouch ? '⚡ ULTİ HAZIR → ⚡ butonuna bas!' : '⚡ ULTİ HAZIR → U tuşuna bas!') : '⚡ Ulti: ' + ultiKills + '/' + ultiNeed(), 20, 74);

  // silah adı
  ctx.fillStyle = '#7dd3fc';
  ctx.font = '12px Segoe UI, Arial';
  ctx.fillText(p.weapon.icon + ' ' + p.weapon.name, 20, 92);

  // aktif perkler (küçük ikon şeridi)
  let pxp = 20;
  ctx.font = '15px Segoe UI, Arial';
  ctx.textAlign = 'left';
  for (const pk of PERKS) {
    const lv = p.perks[pk.key];
    if (lv > 0) { ctx.fillText(pk.ikon + (lv > 1 ? '×' + lv : ''), pxp, 110); pxp += lv > 1 ? 40 : 28; }
  }

  // skor
  ctx.textAlign = 'right';
  ctx.font = 'bold 24px Segoe UI, Arial';
  ctx.fillStyle = '#ffe14d';
  ctx.fillText(score.toLocaleString('tr-TR'), W-22, 38);
  ctx.font = '13px Segoe UI, Arial';
  ctx.fillStyle = '#ffffffaa';
  ctx.fillText('SKOR', W-22, 56);

  // altın (duraklat butonunun soluna hizalı)
  ctx.textAlign = 'right';
  ctx.font = 'bold 20px Segoe UI, Arial';
  ctx.fillStyle = '#ffd54a';
  ctx.fillText('🪙 ' + coins.toLocaleString('tr-TR'), W-22, 82);

  // dalga
  ctx.textAlign = 'center';
  ctx.font = 'bold 18px Segoe UI, Arial';
  ctx.fillStyle = '#c4b5fd';
  ctx.fillText('DALGA ' + wave, W/2, 34);
  const alive = enemies.filter(e => !e.dead).length;
  const bossAlive = enemies.some(e => e.isBoss && !e.dead);
  if (state === 'play' && !bossAlive) {
    ctx.font = '13px Segoe UI, Arial';
    ctx.fillStyle = '#ffffff99';
    ctx.fillText(alive + ' düşman kaldı', W/2, 54);
  }

  if (combo > 1) {
    ctx.textAlign = 'left';
    const s = 1 + Math.min(.4, combo*.02) * Math.max(0, comboTimer/2);
    ctx.save();
    ctx.translate(24, 138);
    ctx.scale(s, s);
    ctx.font = 'bold 26px Segoe UI, Arial';
    ctx.fillStyle = '#ffb347';
    ctx.fillText(combo + 'x KOMBO', 0, 0);
    ctx.restore();
  }

  // BOSS can barı
  const boss = enemies.find(e => e.isBoss && !e.dead);
  if (boss) {
    const bw = 420, bx = (W-bw)/2, by = 66;
    ctx.textAlign = 'center';
    ctx.font = 'bold 15px Segoe UI, Arial';
    ctx.fillStyle = boss.enraged ? '#ff1f4f' : '#ff8fa3';
    ctx.fillText('☠ ' + boss.bossAd + ' — Seviye ' + boss.bossN + (boss.enraged ? '  (ÖFKELİ!)' : ''), W/2, by - 6);
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(bx, by, bw, 16);
    const grad = ctx.createLinearGradient(bx, 0, bx+bw, 0);
    grad.addColorStop(0, '#e11d48'); grad.addColorStop(1, '#ff6b6b');
    ctx.fillStyle = grad;
    ctx.fillRect(bx+2, by+2, (bw-4) * clamp(boss.hp/boss.maxHp, 0, 1), 12);
    ctx.strokeStyle = '#ff8fa3aa'; ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, 16);
  }
}

// ---------- silah seçim ekranı ----------
function cardRect(i) {
  const w = 172, h = 168, gap = 12;
  const total = WKEYS.length*w + (WKEYS.length-1)*gap;
  return { x: (W-total)/2 + i*(w+gap), y: 226, w, h };
}
function startBtnRect() {
  return { x: W/2-150, y: 430, w: 300, h: 56 };
}
function sndBtnRect() { return { x: W-252, y: 16, w: 112, h: 40 }; }
function vibBtnRect() { return { x: W-130, y: 16, w: 114, h: 40 }; }

function drawToggle(r, on, label) {
  ctx.fillStyle = on ? 'rgba(93,255,143,.12)' : 'rgba(255,255,255,.05)';
  ctx.strokeStyle = on ? '#5dff8f' : '#ffffff44';
  ctx.lineWidth = 2;
  roundRect(r.x, r.y, r.w, r.h, 10);
  ctx.fill(); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px Segoe UI, Arial';
  ctx.fillStyle = on ? '#5dff8f' : '#ffffff77';
  ctx.fillText(label, r.x + r.w/2, r.y + 19);
  ctx.font = '11px Segoe UI, Arial';
  ctx.fillText(on ? 'AÇIK' : 'KAPALI', r.x + r.w/2, r.y + 33);
}

function drawSelect() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 46px Segoe UI, Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText('ÇÖP ADAM SAVAŞI', W/2, 90);
  ctx.font = '19px Segoe UI, Arial';
  ctx.fillStyle = '#c4b5fd';
  ctx.fillText('Silahını seç, savaşa hazırlan!', W/2, 124);

  // rekorlar — ilk açılıştan itibaren hep görünür (kalıcı kayıt)
  ctx.font = '14px Segoe UI, Arial';
  ctx.fillStyle = '#ffd54a';
  ctx.fillText('🏆 En iyi skor: ' + best.toLocaleString('tr-TR') + '   •   En uzak dalga: ' + bestWave + '   •   Toplam öldürme: ' + totalKills.toLocaleString('tr-TR'), W/2, 150);

  // ses & titreşim aç/kapa
  drawToggle(sndBtnRect(), soundOn, '🔊 SES');
  drawToggle(vibBtnRect(), vibOn, '📳 TİTREŞİM');

  // başlık figürleri
  drawStick(120, 190, 1, 1.1, '#7dd3fc', { walk: tGlobal*4, lean:.15 }, WEAPONS[WKEYS[selIdx]]);
  drawStick(W-120, 190, -1, 1.1, '#ff6b6b', { walk: tGlobal*4 + 2, lean:.15 }, null);

  for (let i = 0; i < WKEYS.length; i++) {
    const wp = WEAPONS[WKEYS[i]];
    const c = cardRect(i);
    const sel = i === selIdx;

    ctx.fillStyle = sel ? 'rgba(125,211,252,.16)' : 'rgba(255,255,255,.05)';
    ctx.strokeStyle = sel ? '#7dd3fc' : '#ffffff33';
    ctx.lineWidth = sel ? 3 : 1.5;
    roundRect(c.x, c.y, c.w, c.h, 12);
    ctx.fill(); ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = '26px Segoe UI, Arial';
    ctx.fillText(wp.icon, c.x + c.w/2 - 42, c.y + 34);
    ctx.font = 'bold 15px Segoe UI, Arial';
    ctx.fillStyle = sel ? '#7dd3fc' : '#fff';
    ctx.fillText(wp.name, c.x + c.w/2 + 12, c.y + 30);

    // stat çubukları
    const stats = [['Hasar', wp.sDmg, '#ff6b6b'], ['Hız', wp.sSpd, '#4ade80'], ['Menzil', wp.sRng, '#7dd3fc']];
    stats.forEach(([label, v, col], j) => {
      const sy = c.y + 54 + j*22;
      ctx.textAlign = 'left';
      ctx.font = '11px Segoe UI, Arial';
      ctx.fillStyle = '#ffffffaa';
      ctx.fillText(label, c.x + 12, sy + 8);
      ctx.fillStyle = 'rgba(0,0,0,.4)';
      ctx.fillRect(c.x + 56, sy, 104, 9);
      ctx.fillStyle = col;
      ctx.fillRect(c.x + 56, sy, 104*v, 9);
    });

    ctx.textAlign = 'left';
    ctx.font = '11px Segoe UI, Arial';
    ctx.fillStyle = '#5dff8f';
    ctx.fillText(wp.iyi, c.x + 12, c.y + 132);
    ctx.fillStyle = '#ff8fa3';
    ctx.fillText(wp.kotu, c.x + 12, c.y + 150);

    if (sel) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 12px Segoe UI, Arial';
      ctx.fillStyle = '#7dd3fc';
      ctx.fillText('SEÇİLİ', c.x + c.w/2, c.y - 8);
    }
  }

  // başla butonu
  const b = startBtnRect();
  const blink = .5 + .5*Math.abs(Math.sin(tGlobal*2.4));
  ctx.fillStyle = `rgba(255,225,77,${.14 + blink*.12})`;
  ctx.strokeStyle = '#ffe14d';
  ctx.lineWidth = 2.5;
  roundRect(b.x, b.y, b.w, b.h, 14);
  ctx.fill(); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = 'bold 24px Segoe UI, Arial';
  ctx.fillStyle = '#ffe14d';
  ctx.fillText('⚔️ SAVAŞA BAŞLA', W/2, b.y + 37);

  ctx.font = '13px Segoe UI, Arial';
  ctx.fillStyle = '#ffffff88';
  ctx.fillText('Ulti: ' + ULTIS[WKEYS[selIdx]].ad, W/2, b.y - 12);
  if (isTouch) ctx.fillText('Karta dokun → seç  •  💨 DASH ile kaç  •  Her ' + BOSS_EVERY + '. dalgada BOSS → güçlendirme seç!', W/2, 512);
  else ctx.fillText('← → hareket · J yumruk · K silah · Shift/L DASH · U ulti · P duraklat · Her ' + BOSS_EVERY + '. dalgada BOSS!', W/2, 512);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// ---------- çizim ----------
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  if (zoom !== 1) { ctx.translate(W/2, H/2); ctx.scale(zoom, zoom); ctx.translate(-W/2, -H/2); }

  drawBg();

  if (state === 'select') {
    drawSelect();
    ctx.restore();
    return;
  }

  // ulti karartması
  if (ulti) {
    ctx.fillStyle = 'rgba(10,5,40,.45)';
    ctx.fillRect(0, 0, W, H);
  }

  for (const e of enemies) {
    let atkArm = null;
    if (e.atkAnim > 0) atkArm = lerp(1.5, .3, e.atkAnim/.25);
    let col = e.hurt > 0 ? '#ffffff' : e.color;
    if (e.type === 'exploder' && e.fuse > 0 && Math.floor(tGlobal*22) % 2) col = '#ffffff'; // fitil yanıp söner
    if (e.isBoss) { ctx.save(); ctx.shadowColor = e.enraged ? '#ff1f4f' : '#e11d48'; ctx.shadowBlur = 20; }
    drawStick(e.x, e.y, e.face, e.scale, col, {
      walk: e.walk, windup: e.windup, atkArm,
      dead: e.dead, deadT: e.deadT, boss: e.isBoss,
      air: e.isBoss && e.mode === 'air',
      lean: e.windup > 0 ? -.25 : .12
    }, null);
    if (e.isBoss) ctx.restore();

    if (!e.dead) {
      // OKÇU nişan çizgisi (telegraph)
      if (e.type === 'archer' && e.windup > 0) {
        ctx.globalAlpha = .3 + .4*Math.abs(Math.sin(tGlobal*26));
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 6]);
        ctx.beginPath(); ctx.moveTo(e.x, e.y - 58*e.scale); ctx.lineTo(player.x, player.y - 40); ctx.stroke();
        ctx.setLineDash([]); ctx.globalAlpha = 1;
      }
      // PATLAYICI uyarı halkası (telegraph)
      if (e.type === 'exploder' && e.fuse > 0) {
        const pr = 1 - e.fuse/.5;
        ctx.strokeStyle = 'rgba(255,80,40,' + (.4 + .4*Math.abs(Math.sin(tGlobal*30))) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(e.x, e.y - 40*e.scale, 26 + pr*80, 0, Math.PI*2); ctx.stroke();
      }
      // KALKAN
      if (e.type === 'shield') {
        const sx = e.x + e.shieldDir * 19 * e.scale;
        ctx.fillStyle = 'rgba(203,213,225,.4)';
        ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 4;
        ctx.fillRect(e.shieldDir > 0 ? sx : sx - 6, e.y - 80*e.scale, 6, 64*e.scale);
        ctx.beginPath(); ctx.moveTo(sx, e.y - 82*e.scale); ctx.lineTo(sx, e.y - 14*e.scale); ctx.stroke();
      }
      // can barı
      if (e.hp < e.maxHp && !e.isBoss) {
        const bw = 44*e.scale;
        ctx.fillStyle = 'rgba(0,0,0,.5)';
        ctx.fillRect(e.x-bw/2, e.y-120*e.scale, bw, 5);
        ctx.fillStyle = e.color;
        ctx.fillRect(e.x-bw/2, e.y-120*e.scale, bw*clamp(e.hp/e.maxHp,0,1), 5);
      }
    }
  }

  // oyuncu
  {
    const p = player;
    let atkArm = null, punch = null;
    if (p.atk) {
      const def = attackDef(p.atk.type);
      const t = p.atk.t / def.dur;
      if (p.atk.type === 'punch') punch = t;
      else if (p.weapon.draw === 'spear') atkArm = lerp(.6, 1.55, Math.sin(Math.min(1,t)*Math.PI)); // dürtme
      else atkArm = lerp(-1.6, 1.7, Math.min(1, t*1.35)); // savurma
    }
    let col = '#7dd3fc';
    if (p.hurt > 0) col = '#ffffff';
    else if (p.inv > 0 && Math.floor(tGlobal*18) % 2) col = '#7dd3fc66';
    drawStick(p.x, p.y, p.face, 1.05, col, {
      walk: p.walk, atkArm, punch, air: !p.onGround,
      dead: p.dead, deadT: p.dead ? .3 : 0,
      lean: Math.abs(p.vx) > 30 ? .18 : 0
    }, p.weapon);
  }

  // yıldırımlar
  for (const b of bolts) {
    const a = 1 - b.t/.3;
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#fff8d0';
    ctx.lineWidth = 5;
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 22;
    ctx.beginPath();
    b.segs.forEach(([sx, sy], i) => i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy));
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  // boss mermileri (dikenli top)
  for (const b of ebolts) {
    if (b.t > 5) continue;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.spin);
    ctx.shadowColor = b.color; ctx.shadowBlur = 12;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = b.color; ctx.lineWidth = 3;
    for (let i = 0; i < 6; i++) {
      const a = i*Math.PI/3;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*6, Math.sin(a)*6); ctx.lineTo(Math.cos(a)*12, Math.sin(a)*12); ctx.stroke();
    }
    ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // hayalet izler (kısa kılıç ultisi)
  for (const g of ghosts) {
    ctx.save();
    ctx.globalAlpha = (1 - g.t/.4) * .45;
    drawStick(g.x, g.y, g.face, 1.05, '#7dfcff', { walk: 0, lean: .3 }, player ? player.weapon : null);
    ctx.restore();
  }

  // dilim çizgileri
  for (const s of slashes) {
    const a = 1 - s.t/.25;
    const len = 46 + 60*(s.t/.25);
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.ang);
    ctx.globalAlpha = a;
    ctx.shadowColor = '#7dfcff'; ctx.shadowBlur = 14;
    const grd = ctx.createLinearGradient(-len, 0, len, 0);
    grd.addColorStop(0, 'rgba(125,252,255,0)');
    grd.addColorStop(.5, '#ffffff');
    grd.addColorStop(1, 'rgba(125,252,255,0)');
    ctx.strokeStyle = grd;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(len, 0); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // kaya fışkırmaları (balta ultisi)
  for (const q of quakes) {
    const pr = q.t / .55;
    const h = Math.sin(Math.min(1, pr)*Math.PI) * 78;
    ctx.globalAlpha = Math.min(1, 2 - 2*pr);
    for (let i = -1; i <= 1; i++) {
      const bw2 = 13 - Math.abs(i)*4, hh = h * (1 - Math.abs(i)*.3);
      ctx.fillStyle = i === 0 ? '#8d6e63' : '#6d4c41';
      ctx.beginPath();
      ctx.moveTo(q.x + i*16 - bw2, GROUND);
      ctx.lineTo(q.x + i*16, GROUND - hh);
      ctx.lineTo(q.x + i*16 + bw2, GROUND);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // meteorlar (gürz ultisi)
  for (const m of meteors) {
    if (m.hit) continue;
    const pr = clamp(m.t/m.dur, 0, 1);
    const ease = pr*pr*.6 + pr*.4;
    const tx = m.e.x, ty = m.e.y - 20*m.e.scale;
    const mx = lerp(m.sx, tx, ease), my = lerp(m.sy, ty, ease);
    const dxn = tx - m.sx, dyn = ty - m.sy;
    const dl = Math.hypot(dxn, dyn) || 1;
    // kuyruk
    const tgrd = ctx.createLinearGradient(mx - dxn/dl*52, my - dyn/dl*52, mx, my);
    tgrd.addColorStop(0, 'rgba(255,140,66,0)');
    tgrd.addColorStop(1, '#ffd700');
    ctx.strokeStyle = tgrd;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(mx - dxn/dl*52, my - dyn/dl*52);
    ctx.lineTo(mx, my);
    ctx.stroke();
    // ateş topu
    ctx.save();
    ctx.shadowColor = '#ff8c42'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#ffb347';
    ctx.beginPath(); ctx.arc(mx, my, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff3d0';
    ctx.beginPath(); ctx.arc(mx, my, 5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // gökten mızraklar (mızrak ultisi)
  for (const s of spearsFx) {
    const ty = s.e.y - 8;
    let sy2, alpha = 1;
    if (!s.hit) {
      const pr = clamp(s.t/s.dur, 0, 1);
      sy2 = lerp(-70, ty, pr*pr);
      s.x = s.e.x;
    } else {
      sy2 = ty;
      alpha = 1 - Math.max(0, (s.t - s.dur)) / .9;
    }
    ctx.save();
    ctx.globalAlpha = clamp(alpha, 0, 1);
    ctx.shadowColor = '#9fd8ff'; ctx.shadowBlur = 10;
    ctx.strokeStyle = '#cfeaff';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(s.x + 6, sy2 - 74); ctx.lineTo(s.x, sy2); ctx.stroke();
    ctx.fillStyle = '#e8f7ff';
    ctx.beginPath();
    ctx.moveTo(s.x, sy2 + 12);
    ctx.lineTo(s.x - 4.5, sy2 - 2);
    ctx.lineTo(s.x + 4.5, sy2 - 2);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // şok dalgaları
  for (const r of rings) {
    const pr = r.t / r.dur;
    ctx.globalAlpha = (1-pr) * .9;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 3.5 * (1-pr) + 1;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.max * pr, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // parçacıklar
  for (const pt of particles) {
    ctx.globalAlpha = 1 - pt.t/pt.life;
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // yazılar
  for (const f of floaters) {
    const dur = f.big ? 1.6 : 1;
    ctx.globalAlpha = 1 - f.t/dur;
    ctx.font = f.big ? 'bold 30px Segoe UI, Arial' : 'bold 18px Segoe UI, Arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  drawHud();

  if (state === 'wave') {
    const dur = wave % BOSS_EVERY === 0 ? 3 : 2.2;
    const a = clamp(Math.sin((dur-waveTimer)/dur*Math.PI)*1.6, 0, 1);
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    if (wave % BOSS_EVERY === 0) {
      const bn = Math.floor(wave / BOSS_EVERY);
      const T = BOSS_TYPES[(bn - 1) % BOSS_TYPES.length];
      const tremble = Math.sin(tGlobal*30)*3;
      ctx.font = 'bold 54px Segoe UI, Arial';
      ctx.fillStyle = T.color;
      ctx.fillText('⚠ ' + T.ad + ' GELİYOR ⚠', W/2 + tremble, H/2 - 22);
      ctx.font = '20px Segoe UI, Arial';
      ctx.fillStyle = '#ffffffcc';
      ctx.fillText(T.tag + '  •  Boss Seviye ' + bn, W/2, H/2 + 16);
    } else {
      ctx.font = 'bold 56px Segoe UI, Arial';
      ctx.fillStyle = '#fff';
      ctx.fillText('DALGA ' + wave, W/2, H/2 - 20);
      ctx.font = '20px Segoe UI, Arial';
      ctx.fillStyle = '#c4b5fd';
      ctx.fillText('Hazırlan!', W/2, H/2 + 16);
    }
    ctx.globalAlpha = 1;
  }

  if (state === 'gameover') drawGameOver();
  if (state === 'perkpick') drawPerkPick();
  if (paused) drawPause();

  // beyaz şimşek parlaması
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,250,225,${flash*.75})`;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();
}

// ---------- duraklatma / mağaza ----------
function pauseCardRect(i) {
  const n = SHOP.length;
  const w = n >= 4 ? 210 : 260, h = 150, gap = 14;
  const total = n*w + (n-1)*gap;
  return { x: (W-total)/2 + i*(w+gap), y: 190, w, h };
}
function pauseResumeRect() { return { x: W/2-140, y: 366, w: 280, h: 48 }; }

function drawPause() {
  ctx.fillStyle = 'rgba(8,6,18,.82)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.font = 'bold 44px Segoe UI, Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText('⏸ DURAKLADI', W/2, 84);

  // altın
  ctx.font = 'bold 24px Segoe UI, Arial';
  ctx.fillStyle = '#ffd54a';
  ctx.fillText('🪙 ' + coins.toLocaleString('tr-TR') + ' altın', W/2, 122);
  ctx.font = '14px Segoe UI, Arial';
  ctx.fillStyle = '#c4b5fd';
  ctx.fillText('MAĞAZA — düşman öldürerek altın kazan, güçlen!', W/2, 150);

  for (let i = 0; i < SHOP.length; i++) {
    const item = SHOP[i];
    const c = pauseCardRect(i);
    const lv = player.up[item.key];
    const maxed = lv >= item.max;
    const cost = upCost(item);
    const afford = coins >= cost;

    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.strokeStyle = item.renk + 'aa';
    ctx.lineWidth = 2;
    roundRect(c.x, c.y, c.w, c.h, 12);
    ctx.fill(); ctx.stroke();

    ctx.textAlign = 'left';
    ctx.font = '24px Segoe UI, Arial';
    ctx.fillText(item.ikon, c.x + 14, c.y + 36);
    ctx.font = 'bold 17px Segoe UI, Arial';
    ctx.fillStyle = item.renk;
    ctx.fillText(item.ad, c.x + 46, c.y + 32);

    ctx.font = '12px Segoe UI, Arial';
    ctx.fillStyle = '#ffffffcc';
    ctx.fillText(item.efekt, c.x + 14, c.y + 58);

    // seviye noktaları
    const dotY = c.y + 76;
    const dw = (c.w - 28) / item.max;
    for (let d = 0; d < item.max; d++) {
      ctx.fillStyle = d < lv ? item.renk : 'rgba(255,255,255,.18)';
      ctx.fillRect(c.x + 14 + d * dw, dotY, dw - 3, 7);
    }
    ctx.font = '12px Segoe UI, Arial';
    ctx.fillStyle = '#ffffff99';
    ctx.fillText('Seviye ' + lv + ' / ' + item.max, c.x + 14, c.y + 102);

    // satın al şeridi
    ctx.fillStyle = maxed ? 'rgba(93,255,143,.15)' : afford ? 'rgba(255,213,74,.16)' : 'rgba(255,107,107,.12)';
    roundRect(c.x + 12, c.y + 112, c.w - 24, 28, 8);
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.font = 'bold 16px Segoe UI, Arial';
    ctx.fillStyle = maxed ? '#5dff8f' : afford ? '#ffd54a' : '#ff8fa3';
    ctx.fillText(maxed ? '✓ MAKS' : ('🪙 ' + cost + (isTouch ? '' : '  [' + (i+1) + ']')), c.x + c.w/2, c.y + 131);
  }

  // devam et
  const r = pauseResumeRect();
  const blink = .5 + .5*Math.abs(Math.sin(tGlobal*2.4));
  ctx.fillStyle = 'rgba(93,255,143,' + (.14 + blink*.12) + ')';
  ctx.strokeStyle = '#5dff8f';
  ctx.lineWidth = 2.5;
  roundRect(r.x, r.y, r.w, r.h, 14);
  ctx.fill(); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = 'bold 22px Segoe UI, Arial';
  ctx.fillStyle = '#5dff8f';
  ctx.fillText('▶ DEVAM ET', W/2, r.y + 33);

  ctx.font = '13px Segoe UI, Arial';
  ctx.fillStyle = '#ffffff88';
  ctx.fillText(isTouch ? 'Kart → satın al  •  DEVAM ET → oyna' : 'P / ESC : devam  •  1 / 2 / 3 : yükseltme satın al', W/2, 448);
}

// ---------- perk seçim ekranı ----------
function perkCardRect(i) {
  const w = 248, h = 210, gap = 26;
  const n = Math.max(perkChoices.length, 1);
  const total = n*w + (n-1)*gap;
  return { x: (W-total)/2 + i*(w+gap), y: 196, w, h };
}
function wrapText(text, cx, y, maxW, lh) {
  const words = text.split(' ');
  let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, cx, yy); line = w; yy += lh; }
    else line = test;
  }
  if (line) ctx.fillText(line, cx, yy);
}
function drawPerkPick() {
  ctx.fillStyle = 'rgba(8,6,18,.86)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 40px Segoe UI, Arial';
  ctx.fillStyle = '#ffd700';
  ctx.fillText('☠ BOSS ALT EDİLDİ! ☠', W/2, 96);
  ctx.font = '19px Segoe UI, Arial';
  ctx.fillStyle = '#c4b5fd';
  ctx.fillText('Bir güçlendirme seç — bu koşu boyunca kalıcı kalır', W/2, 132);

  for (let i = 0; i < perkChoices.length; i++) {
    const pk = perkChoices[i], c = perkCardRect(i), cur = player.perks[pk.key];
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.strokeStyle = pk.renk;
    ctx.lineWidth = 3;
    roundRect(c.x, c.y, c.w, c.h, 14);
    ctx.fill(); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.font = '46px Segoe UI, Arial';
    ctx.fillText(pk.ikon, c.x + c.w/2, c.y + 62);
    ctx.font = 'bold 22px Segoe UI, Arial';
    ctx.fillStyle = pk.renk;
    ctx.fillText(pk.ad, c.x + c.w/2, c.y + 100);
    ctx.font = '14px Segoe UI, Arial';
    ctx.fillStyle = '#ffffffcc';
    wrapText(pk.desc, c.x + c.w/2, c.y + 128, c.w - 28, 19);
    ctx.font = '13px Segoe UI, Arial';
    ctx.fillStyle = cur > 0 ? '#5dff8f' : '#ffffff66';
    ctx.fillText(cur > 0 ? ('Mevcut seviye: ' + cur + ' / ' + pk.max) : 'YENİ!', c.x + c.w/2, c.y + c.h - 34);
    const blink = .6 + .4*Math.abs(Math.sin(tGlobal*3 + i));
    ctx.fillStyle = 'rgba(255,255,255,' + (.08 + blink*.08) + ')';
    roundRect(c.x + 14, c.y + c.h - 28, c.w - 28, 20, 7); ctx.fill();
    ctx.font = 'bold 14px Segoe UI, Arial';
    ctx.fillStyle = pk.renk;
    ctx.fillText(isTouch ? 'SEÇ' : 'SEÇ  [' + (i+1) + ']', c.x + c.w/2, c.y + c.h - 13);
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(8,6,18,.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 52px Segoe UI, Arial';
  ctx.fillStyle = '#ff4d6d';
  ctx.fillText('OYUN BİTTİ', W/2, 176);
  if (newRecord) {
    const s = 1 + .12*Math.abs(Math.sin(tGlobal*6));
    ctx.save(); ctx.translate(W/2, 212); ctx.scale(s, s);
    ctx.font = 'bold 26px Segoe UI, Arial'; ctx.fillStyle = '#ffd700';
    ctx.fillText('🏆 YENİ REKOR! 🏆', 0, 0); ctx.restore();
  }
  ctx.font = '24px Segoe UI, Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText('Skor: ' + score.toLocaleString('tr-TR'), W/2, 258);
  ctx.fillStyle = '#c4b5fd';
  ctx.font = '18px Segoe UI, Arial';
  ctx.fillText('Ulaşılan dalga: ' + wave + '    •    Alt edilen düşman: ' + kills, W/2, 292);
  ctx.fillStyle = '#ffe14d';
  ctx.font = '15px Segoe UI, Arial';
  ctx.fillText('🏆 En iyi: ' + best.toLocaleString('tr-TR') + '  •  En uzak dalga: ' + bestWave + '  •  Toplam öldürme: ' + totalKills.toLocaleString('tr-TR'), W/2, 322);
  const blink = Math.abs(Math.sin(tGlobal*2.4));
  ctx.globalAlpha = .4 + blink*.6;
  ctx.font = 'bold 22px Segoe UI, Arial';
  ctx.fillStyle = '#5dff8f';
  ctx.fillText(isTouch ? 'Silah seçimine dönmek için dokun' : 'Silah seçimine dönmek için tıkla veya R', W/2, 380);
  ctx.globalAlpha = 1;
}

// ---------- döngü ----------
function syncTouchButtons() {
  if (!isTouch) return;
  const inGame = state === 'play' || state === 'wave';
  const showControls = inGame && !paused;
  for (const id of ['btnL','btnR','btnJ','btnP','btnS','btnDash']) {
    document.getElementById(id).style.display = showControls ? 'flex' : 'none';
  }
  btnU.style.display = (showControls && ultiReady && !ulti) ? 'flex' : 'none';
  document.getElementById('btnPause').style.display = (inGame && !paused) ? 'flex' : 'none';
}

loadSave();
let last = performance.now();
function loop(now) {
  const dt = Math.min(.033, (now - last)/1000);
  last = now;
  zoom += (1 - zoom) * Math.min(1, dt * 9); // zoom-punch geri sönümü
  if (zoom < 1.0005) zoom = 1;
  if (hitstop > 0 && !paused) {
    // vuruş donması: oyunu kısa süre dondur ama çizmeye devam et
    hitstop -= dt;
    tGlobal += dt;
    draw();
    syncTouchButtons();
    requestAnimationFrame(loop);
    return;
  }
  update(dt);
  draw();
  syncTouchButtons();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
